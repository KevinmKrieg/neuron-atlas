name: Native neuron scan
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test reporting utilities
        run: python -m pytest -q
      - name: Scan Qwen3-0.6B native MLP neurons
        run: python -m src.scan --device cpu --layers 12 --max-lines 12 --max-tokens 96 --top-k 5
      - name: Write neuron report
        run: python -m src.report --scan results/scan.json --out results/report.md --layer 12 --count 40
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuron-atlas-scan
          path: |
            results/scan.json
            results/report.md
          if-no-files-found: warn
